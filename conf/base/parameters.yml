# ── UNIVERSO DE ACTIVOS ───────────────────────────────
# Rama: feature/crypto — inversión corto/mediano plazo
# Universo crypto-heavy: capturar bull runs con rotación entre altcoins
universe:
  # ── Pure crypto: modelo agresivo, máximo riesgo/recompensa ───
  - "BTC-USD" # Bitcoin — reserva de valor, lidera ciclos
  - "ETH-USD" # Ethereum — DeFi, NFTs, contratos inteligentes
  - "BNB-USD" # Binance Coin — utility token del mayor exchange
  - "XRP-USD" # Ripple — pagos internacionales, regulación aclarada
  - "SOL-USD" # Solana — alta velocidad, ecosistema creciente
  - "AVAX-USD"# Avalanche — L1 competidor de ETH
  - "LINK-USD"# Chainlink — infraestructura oráculos DeFi
  - "DOGE-USD"# Dogecoin — alta liquidez, momentum especulativo
  - "LTC-USD" # Litecoin — "digital silver", ciclo vinculado a BTC

ticker: "BTC-USD"      # ticker principal para reportes LLM
timeframe: "1d"
start_date: "2019-01-01"   # incluye ciclo completo: bull 2021 + bear 2022 + recovery
end_date: "2026-04-27"

# ── INDICADORES TÉCNICOS ──────────────────────────────
technical:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_period: 20
  bb_std: 2
  ema_200: 200           # filtro de tendencia principal (200d clasico)

# ── RIESGO — PERFIL AGRESIVO ─────────────────────────
# Modelo agresivo: deja correr ganadores, mínimos frenos, 100% invertido.
risk:
  max_positions: 2              # concentración en top 2 del ranking
  stop_loss_atr_mult: 6.0       # stop amplio: evita whipsaws de la volatilidad crypto
  max_position_pct: 0.50        # 50% por posición
  stop_loss_pct: 0.05
  take_profit_pct: 0.10
  # ── Controles de riesgo (minimizados) ──────────────
  min_entry_score: 0.5          # umbral bajo: captura momentum naciente, más trades
  max_drawdown_circuit: 0.55    # circuit ancho: solo frena ante bear real (-55%), no correcciones
  circuit_break_cooldown: 1     # re-entra al día siguiente tras un susto
  vix_crisis_threshold: 999     # VIX desactivado — irrelevante para crypto puro

# ── AGENTES LLM ──────────────────────────────────────
llm:
  model: "openai/gpt-5-nano"
  temperature: 0.1
  confidence_threshold: 0.50
  # ── TradingAgents (confirmación antes de ejecutar en Alpaca) ─
  tradingagents:
    enabled: true               # confirma BUY signals antes de Alpaca
    confidence_threshold: 0.60  # solo analiza BUY con confidence >= 60%
    top_n_signals: 3            # máximo 3 signals por corrida

# ── POLYMARKET ───────────────────────────────────────
polymarket:
  base_url: "https://gamma-api.polymarket.com"
  min_volume: 5000              # solo mercados con al menos $5k de volumen
  max_score_contribution: 1.5   # aporte máximo al score final (±1.5 puntos)

# ── BACKTESTING ──────────────────────────────────────
backtesting:
  initial_capital: 10000
  commission: 0.001
  rebalance_day: 0              # 0 = lunes (isoweekday - 1)
  walk_forward_split: "2022-01-01"  # in-sample: bull 2019-2021 | OOS: bear 2022 + recovery 2023-2026
  rebalance_interval: 3             # rotacion cada 3 dias — optimo agresivo (CAGR 46%, Sharpe 1.303)
