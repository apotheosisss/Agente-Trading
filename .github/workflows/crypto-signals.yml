name: Crypto Account — TSMOM long/short (Mon-Fri)

# El modelo de cripto se retiró: esta cuenta ahora corre la MISMA estrategia
# TSMOM que Polymarket (codigo en feature/polymarket), sobre la cuenta Alpaca
# de cripto (ALPACA_API_KEY / ALPACA_SECRET_KEY). Opera ETFs de bolsa → Lun-Vie.

on:
  schedule:
    - cron: "15 13 * * 1-5"   # 13:15 UTC = 08:15 EST (antes de apertura), solo dias habiles
  workflow_dispatch:           # permite ejecutar manualmente desde GitHub

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature/polymarket
        uses: actions/checkout@v4
        with:
          ref: feature/polymarket

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Create credentials.yml from secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          mkdir -p conf/local
          python - <<'PYEOF'
          import os, yaml
          creds = {
              "alpaca": {
                  "api_key": os.environ["ALPACA_API_KEY"],
                  "secret_key": os.environ["ALPACA_SECRET_KEY"],
                  "paper_trading": True,
              },
              "telegram": {
                  "bot_token": os.environ.get("TELEGRAM_BOT_TOKEN", ""),
                  "chat_id": os.environ.get("TELEGRAM_CHAT_ID", ""),
              },
              "openai": {
                  "api_key": os.environ.get("OPENAI_API_KEY", ""),
              },
          }
          with open("conf/local/credentials.yml", "w") as f:
              yaml.dump(creds, f, default_flow_style=False)
          print("credentials.yml creado correctamente")
          PYEOF

      # Estrategia TSMOM long/short multi-activo + ejecucion en Alpaca paper.
      # tsmom_trade = ingestion + tsmom (pesos objetivo) + alpaca_tsmom (ordenes delta).
      # Se descarga desde 2015 para tener historia suficiente (reversion 504d + momentum 252d).
      - name: Run TSMOM strategy + Alpaca paper execution
        run: |
          END=$(date +%Y-%m-%d)
          uv run kedro run --pipeline=tsmom_trade --params="start_date=2015-01-01,end_date=$END,tsmom.live_gross=2.0,tsmom.live_max_position_pct=0.5,tsmom.pvt=0.24,tsmom.max_lev=4.0"

      - name: Send Telegram notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          uv run python - <<'PYEOF' || true
          import sys
          from pathlib import Path
          from datetime import datetime, timezone
          sys.path.insert(0, "src")
          import notifier
          import pandas as pd

          d = Path("data/07_model_output")
          today = datetime.now(timezone.utc).strftime("%d %b %Y")

          # ── Pesos objetivo (largos/cortos, exposicion) ──
          wfile = d / "tsmom_weights.csv"
          if wfile.exists():
              w = pd.read_csv(wfile)
              longs = int((w["target_weight"] > 1e-6).sum())
              shorts = int((w["target_weight"] < -1e-6).sum())
              gross = float(w["target_weight"].abs().sum())
              w = w.reindex(w["target_weight"].abs().sort_values(ascending=False).index)
              top = ", ".join(
                  f"{r.ticker} {r.target_weight:+.2f}"
                  for r in w.head(4).itertuples() if abs(r.target_weight) > 1e-6
              ) or "ninguno"
              sig_line = f"Largos {longs} / Cortos {shorts} | bruto {gross:.2f}x\nTop: {top}"
          else:
              sig_line = "sin pesos calculados"

          # ── Ordenes ejecutadas (versionado → ultimo) ──
          logs = sorted(d.rglob("tsmom_alpaca_log.csv"), key=lambda p: p.stat().st_mtime)
          exec_str = "ninguna"
          if logs:
              lf = pd.read_csv(logs[-1])
              n_sub = int((lf["status"] == "submitted").sum())
              n_err = int((lf["status"] == "error").sum())
              parts = []
              if n_sub:
                  parts.append(f"{n_sub} ordenes enviadas")
              if n_err:
                  parts.append(f"{n_err} errores (ver log)")
              exec_str = " | ".join(parts) or "sin cambios"

          # ── Estado de la cuenta ──
          accs = sorted(d.rglob("alpaca_account.csv"), key=lambda p: p.stat().st_mtime)
          eq_str = ""
          if accs:
              ac = pd.read_csv(accs[-1])
              eq_str = (
                  f"\nCuenta: ${float(ac['equity_usd'].iloc[0]):,.0f} | "
                  f"Pos: {int(ac['n_positions'].iloc[0])}"
              )

          notifier.send(
              f"TSMOM (cuenta Crypto) — {today}\n{sig_line}\nEjecutado: {exec_str}{eq_str}"
          )
          PYEOF
