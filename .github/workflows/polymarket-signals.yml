name: Polymarket Signals (Mon-Fri 17:00 EST) — TSMOM long/short

on:
  schedule:
    - cron: "20 21 * * 1-5"  # 21:20 UTC = 16:20 EST, evita congestion hora en punto
  workflow_dispatch:           # permite ejecutar manualmente desde GitHub

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature/polymarket
        uses: actions/checkout@v4
        with:
          ref: feature/polymarket

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Create credentials.yml from secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY_POLY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY_POLY }}
        run: |
          mkdir -p conf/local
          python - <<'PYEOF'
          import os, yaml
          creds = {
              "alpaca": {
                  "api_key": os.environ["ALPACA_API_KEY"],
                  "secret_key": os.environ["ALPACA_SECRET_KEY"],
                  "paper_trading": True,
              },
              "telegram": {
                  "bot_token": os.environ.get("TELEGRAM_BOT_TOKEN", ""),
                  "chat_id": os.environ.get("TELEGRAM_CHAT_ID", ""),
              },
              "openai": {
                  "api_key": os.environ.get("OPENAI_API_KEY", ""),
              },
          }
          with open("conf/local/credentials.yml", "w") as f:
              yaml.dump(creds, f, default_flow_style=False)
          print("credentials.yml creado correctamente")
          PYEOF

      # Estrategia TSMOM long/short multi-activo + ejecucion en Alpaca paper.
      # tsmom_trade = ingestion + tsmom (pesos objetivo) + alpaca_tsmom (ordenes delta).
      # Se descarga desde 2015 para tener historia suficiente (reversion 504d + momentum 252d).
      - name: Run TSMOM strategy + Alpaca paper execution
        run: |
          END=$(date +%Y-%m-%d)
          uv run kedro run --pipeline=tsmom_trade --params="start_date=2015-01-01,end_date=$END"

      - name: Send Telegram notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          uv run python - <<'PYEOF' || true
          import sys
          from pathlib import Path
          from datetime import datetime, timezone
          sys.path.insert(0, "src")
          import notifier
          import pandas as pd

          d = Path("data/07_model_output")
          today = datetime.now(timezone.utc).strftime("%d %b %Y")
          NL = chr(10)

          # Senal (largos/cortos)
          wfile = d / "tsmom_weights.csv"
          if wfile.exists():
              w = pd.read_csv(wfile)
              longs = int((w["target_weight"] > 1e-6).sum())
              shorts = int((w["target_weight"] < -1e-6).sum())
              sig_line = f"Senal: {longs} largos / {shorts} cortos"
          else:
              sig_line = "sin pesos"

          # Cuenta + exposicion real (desde posiciones)
          accs = sorted(d.rglob("alpaca_account.csv"), key=lambda p: p.stat().st_mtime)
          equity, eq_line = None, ""
          if accs:
              ac = pd.read_csv(accs[-1])
              equity = float(ac["equity_usd"].iloc[0])
              eq_line = f"Cuenta: ${equity:,.0f} | Pos: {int(ac['n_positions'].iloc[0])}"
          poss = sorted(d.rglob("alpaca_positions.csv"), key=lambda p: p.stat().st_mtime)
          if poss and equity:
              pv = pd.read_csv(poss[-1])
              if "market_value_usd" in pv.columns and len(pv):
                  g = pv["market_value_usd"].abs().sum() / equity
                  sig_line = sig_line + f" | exposicion real {g:.2f}x"

          # Detalle de ordenes (OK / omitidas / errores) desde el log
          logs = sorted(d.rglob("tsmom_alpaca_log.csv"), key=lambda p: p.stat().st_mtime)
          exec_lines = ["Ejecutado: sin ordenes"]
          if logs:
              lf = pd.read_csv(logs[-1])
              sub = lf[lf["status"] == "submitted"]
              skp = lf[lf["status"] == "skipped"]
              err = lf[lf["status"] == "error"]
              exec_lines = []
              if len(sub):
                  exec_lines.append("OK (%d): " % len(sub) + ", ".join(
                      f"{r.ticker} {r.side}" for r in sub.itertuples()))
              if len(skp):
                  exec_lines.append("Omitidas (%d): " % len(skp) + ", ".join(
                      str(r.ticker) for r in skp.itertuples()))
              for r in err.itertuples():
                  exec_lines.append(f"ERROR {r.ticker} {r.side}: {str(r.message)[:70]}")
              if not exec_lines:
                  exec_lines = ["sin cambios"]

          parts = [f"TSMOM (Polymarket) — {today}", sig_line] + exec_lines
          if eq_line:
              parts.append(eq_line)
          notifier.send(NL.join(parts))
          PYEOF
